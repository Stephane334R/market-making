[package]
name = "sim"
version = "0.1.0"
edition = "2021"
description = "Fill simulator: replays an exported quote schedule over normalized book + trades"

[dependencies]
anyhow = "1.0.104"
arrow = { version = "60.1.0", default-features = false }
parquet = { version = "60.1.0", default-features = false, features = ["arrow", "zstd", "snap"] }
serde_json = "1.0.154"
