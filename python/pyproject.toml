[project]
name = "mm"
version = "0.1.0"
description = "Market-making research framework for the Bybit BTCUSDT linear perpetual"
requires-python = ">=3.11"
dependencies = [
    "orjson>=3.13.0",
    "pyarrow>=26.0.1",
]

[project.scripts]
mm-bybit = "mm.download_bybit:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mm"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
