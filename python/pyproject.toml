[project]
name = "mm"
version = "0.1.0"
description = "Market-making research framework for the Bybit BTCUSDT linear perpetual"
readme = "../README.md"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mm"]

[tool.pytest.ini_options]
testpaths = ["../tests"]
